name: Cloud Video Compressor (1080p TV Compatible H.264)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Paste a direct video download link here'
        required: true
        type: string

# The release action needs permission to create releases and upload assets.
permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video from Direct Link
      env:
        VIDEO_URL: ${{ inputs.video_url }}
      run: |
        set -euo pipefail

        # Keep the URL in an environment variable so shell characters cannot inject commands.
        if ! wget --quiet \
          --max-redirect=5 \
          --timeout=60 \
          --tries=3 \
          --waitretry=5 \
          --output-document=input_video.mp4 \
          -- "$VIDEO_URL"; then
          echo "::error::Video download failed. Check that the direct video link is valid and has not expired."
          exit 1
        fi

        test -s input_video.mp4 || {
          echo "::error::The downloaded file is empty."
          exit 1
        }

    - name: Validate Input Video
      run: |
        set -euo pipefail

        video_codec="$(ffprobe -v error \
          -select_streams v:0 \
          -show_entries stream=codec_name \
          -of default=noprint_wrappers=1:nokey=1 \
          input_video.mp4 2>/dev/null || true)"

        if [[ -z "$video_codec" ]]; then
          echo "::error::The downloaded file does not contain a readable video stream."
          exit 1
        fi

        echo "Input video codec: $video_codec"

    - name: Compress Video to TV-Compatible H.264
      run: |
        ffmpeg -hide_banner -y -i input_video.mp4 \
          -map 0:v:0 \
          -map 0:a:0? \
          -vf "scale=w='min(1920,iw)':h='min(1080,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" \
          -c:v libx264 \
          -preset medium \
          -crf 21 \
          -profile:v high \
          -level:v 4.1 \
          -pix_fmt yuv420p \
          -tag:v avc1 \
          -c:a aac \
          -b:a 128k \
          -ac 2 \
          -movflags +faststart \
          -map_metadata 0 \
          output_compress.mp4

    - name: Upload Compressed Video to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: output_compress.mp4
        tag_name: compressed-film-${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
